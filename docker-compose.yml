name: vitals

services:
  postgres:
    container_name: vitals-postgres
    image: postgres:16
    platform: linux/arm64
    shm_size: 16g
    command: postgres -c 'max_connections=500' -c work_mem=256MB -c maintenance_work_mem=256MB -c max_wal_size=1GB
    ports:
      - 21821:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - vitals
    environment:
      - POSTGRES_DB=vitals
      - POSTGRES_USER=vitals
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitals -d vitals"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  indexer:
    container_name: vitals-indexer
    platform: linux/arm64
    restart: on-failure:5
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - 21820:42069
    volumes:
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./yarn.lock:/app/yarn.lock
    command: yarn run indexer:dev
    networks:
      - vitals
    depends_on:
      - postgres
    environment:
      - PONDER_RPC_URL_8453=${PONDER_RPC_URL_8453:-https://mainnet.base.org}
      - PONDER_RPC_URL_369=${PONDER_RPC_URL_369:-https://rpc.pulsechain.com}
      - DATABASE_URL=postgres://vitals:password@postgres:5432/vitals
      - DATABASE_SCHEMA=public

networks:
  vitals:
    driver: bridge
